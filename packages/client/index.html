<!doctype html>
<html>

    <title>The Grand</title>
    <link rel="icon" href="data:," />
    <style>

      /* #364: the shop and the bag show the item, not its name — one cropped cell of the shipped

      #catalog, #inventory { flex-direction: column; align-items: stretch; gap: 6px; }
      #catalog .themes { display: flex; flex-wrap: wrap; gap: 6px; }
      #catalog .themes button { padding: 4px 9px; border-radius: 8px; border: 1px solid #6a5a2e;

      #catalog .themes button.on { border-color: #ffd76a; background: #3a3016; color: #ffe9a8; }
      #catalog .grid, #inventory .grid { display: grid; gap: 6px; max-height: 32vh;
        overflow-y: auto; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); }
      #catalog .grid button, #inventory .grid button { display: grid; justify-items: center;
        gap: 2px; padding: 5px 4px; border-radius: 8px; cursor: pointer; }
      #catalog .grid button { border: 1px solid #6a5a2e; background: #2b2517e6; color: #eee0b0; }
      /* Too dear to buy, not too dear to look at: the card stays opaque so the name and the price

      #catalog .grid button:disabled { cursor: default; border-color: #4a4133;

      #catalog .grid button:disabled .thumb { opacity: .45; }
      #inventory .grid button { border: 1px solid #444c63; background: #1c1f2be6; color: #eef; }
      #inventory .grid button.armed { border-color: #7fd98a; background: #24422a; }
      #catalog .name, #inventory .name { font-size: 11px; line-height: 1.2; text-align: center;

      #catalog .price { font-size: 12px; font-weight: 600; color: #ffd76a; }
      #catalog .grid button:disabled .price { color: #b3a476; }
      #catalog .empty, #inventory .empty { color: #7d8496; font-size: 13px; }
      .thumb { position: relative; display: block; overflow: hidden; width: 72px; height: 64px; }
      .thumb img { position: absolute; image-rendering: pixelated; }
      .thumb.blank { display: flex; align-items: center; justify-content: center; font-size: 10px;
        color: #8a8172; border: 1px dashed #8a5a3a; box-sizing: border-box; background:
        repeating-linear-gradient(45deg, #2a2119, #2a2119 5px, #191410 5px, #191410 10px); }

      #hint { color: #7d8496; font-size: 12px; }
      #trade { position: fixed; top: 60px; right: 12px; width: 320px; background: #1c1f2bf2;

      #trade .row { display: flex; gap: 8px; }
      #trade .row button { flex: 1; padding: 7px 8px; border-radius: 6px;

      #nav-open { position: fixed; top: 56px; left: 12px; padding: 5px 10px;
        border-radius: 8px; border: 1px solid #444c63; background: #1c1f2be6; color: #eef;
        cursor: pointer; display: none; }

        cursor: pointer; display: none; }
      #arcade-open { position: fixed; top: 120px; left: 12px; padding: 5px 10px;
        border-radius: 8px; border: 1px solid #6a5a2e; background: #2b2517e6; color: #eee0b0;
        cursor: pointer; display: none; }
      #nav { position: fixed; top: 56px; left: 130px; width: 280px; background: #1c1f2bf2;

      #nav[hidden] { display: none; }
      #nav h2 { margin: 0; font-size: 15px; }
      #nav-list { display: grid; gap: 5px; max-height: 320px; overflow-y: auto; }
      #nav-list button { padding: 6px 9px; border-radius: 6px; border: 1px solid #444c63;

      #arcade { position: fixed; top: 160px; left: 12px; width: 220px; background: #1c1f2bf2;

      #arcade .row { display: flex; gap: 6px; }
      #arcade .row button { flex: 1; padding: 7px 4px; border-radius: 6px;

      /* #429: no launcher button — the bet panel opens where the wheel is, because a bet is only

      #wheel { position: fixed; top: 96px; right: 12px; width: 250px; background: #1c1f2bf2;

      #wheel .row { display: flex; gap: 6px; }

      #sets-open { position: fixed; top: 184px; left: 12px; padding: 5px 10px;

      #zoom-open { position: fixed; top: 248px; left: 12px; padding: 5px 10px;

        cursor: pointer; display: none; }
      #sets { position: fixed; top: 224px; left: 12px; width: 260px; background: #1c1f2bf2;

      #sets[hidden] { display: none; }

      #blackjack[hidden] { display: none; }

      #bj-status { font-size: 13px; color: #9aa3b8; min-height: 18px; }

      #blackjack .row { display: flex; gap: 6px; }
      #blackjack .row button { flex: 1; padding: 7px 4px; border-radius: 6px;
        border: 1px solid #444c63; background: #2c3346; color: #eef; cursor: pointer; }
      #blackjack .row button:disabled { opacity: .4; cursor: default; }
      #furni-menu .engraved { font-style: italic; color: #c9b27a; }
      /* #321: the strips covered the lower half of an oversized room. Collapsed behind tabs,

      #hud-tabs { display: flex; gap: 6px; }
      #hud-tabs button { padding: 5px 10px; border-radius: 8px; border: 1px solid #444c63;
        background: #1c1f2be6; color: #eef; cursor: pointer; font-size: 13px; }
      #hud-tabs button.open { border-color: #7fb2d9; background: #24405c; }
      #catalog, #inventory { display: none; }
      #catalog.open, #inventory.open { display: flex; }
      #sets-close { padding: 6px 9px; border-radius: 6px; border: 1px solid #444c63;
        background: #2c3346; color: #eef; cursor: pointer; }
      /* #344: create-your-look and the wardrobe are one full-screen panel. Layout is specified at
         1440x900; every colour here is already in this file or a style.ts ramp. */
      #creator { position: fixed; inset: 0; background: #11131a; display: none;
        flex-direction: column; }
      #creator.open { display: flex; }
      #creator button { font: inherit; }
      #creator header { display: flex; align-items: baseline; gap: 14px; padding: 16px 24px 12px; }
      #creator header .brand { font-size: 18px; font-weight: 700; }

      #creator .picker { flex: 1; min-width: 0; display: flex; gap: 12px; }

  <body>
    <div id="stage"></div>
    <div id="bubbles"></div>
    <div id="room-name"></div>
    <div id="stars"></div>
    <button type="button" id="nav-open">🧭 Rooms</button>
    <button type="button" id="suite-nav"></button>
    <button type="button" id="arcade-open">🎰 Hi-Lo</button>
    <button type="button" id="lever-open">🎟️ Luck Lever</button>
    <button type="button" id="sets-open">🏅 Collections</button>
    <button type="button" id="zoom-open" title="Zoom (Z)"></button>
    <div id="nav" hidden>
      <h2>Navigator</h2>
      <div id="nav-list"></div>
      <button type="button" id="nav-close">Close</button>
    </div>
    <div id="arcade" hidden>
      <h2>Hi-Lo</h2>
      <div id="arcade-card"></div>
      <div id="arcade-score"></div>
      <div class="row">
        <button type="button" id="arcade-higher">Higher</button>
        <button type="button" id="arcade-lower">Lower</button>
        <button type="button" id="arcade-stop">Stop</button>
      </div>
      <div id="arcade-status"></div>
      <div class="row">
        <button type="button" id="arcade-deal">Deal</button>
        <button type="button" id="arcade-close">Close</button>
      </div>
    </div>
    <div id="blackjack" hidden>
      <h2>Blackjack</h2>
      <div id="bj-dealer" class="bj-cards"></div>
      <div id="bj-dealer-total" class="bj-total"></div>
      <div id="bj-player" class="bj-cards"></div>
      <div id="bj-player-total" class="bj-total"></div>
      <div id="bj-status"></div>
      <div id="bj-headroom"></div>
      <div class="row">
        <button type="button" id="bj-stake-10">10 ★</button>
        <button type="button" id="bj-stake-25">25 ★</button>
        <button type="button" id="bj-stake-50">50 ★</button>
        <button type="button" id="bj-stake-100">100 ★</button>
      </div>
      <div class="row">
        <button type="button" id="bj-hit">Hit</button>
        <button type="button" id="bj-stand">Stand</button>
      </div>
      <button type="button" id="bj-close">Close</button>
    </div>
    <div id="lever" hidden>
      <h2>Luck Lever</h2>
      <div id="lever-result"></div>
      <div class="row">
        <button type="button" id="lever-pull"></button>
        <button type="button" id="lever-close">Close</button>
      </div>
      <div id="lever-odds"></div>
    </div>
    <!-- #429: built by WheelPanel, like the creator — the markup is the panel's, not the page's. -->
    <div id="wheel" hidden></div>
    <div id="sets" hidden>
      <h2>Collections</h2>
      <div id="sets-list"></div>
      <button type="button" id="sets-close">Close</button>
    </div>
    <div id="toasts"></div>
    <div id="trade" hidden>
      <h2 id="trade-title"></h2>
      <div class="cols">
        <div><h3>You give</h3><div id="trade-yours" class="items"></div></div>
        <div><h3>You get</h3><div id="trade-theirs" class="items"></div></div>
      </div>
      <div id="trade-warning"></div>
      <div id="trade-status"></div>
      <div class="row">
        <button type="button" id="trade-accept">Accept</button>
        <button type="button" id="trade-cancel">Cancel</button>
      </div>
    </div>
    <div id="hud">
      <div id="hud-tabs">
        <button type="button" id="tab-catalog">🛍️ Catalog</button>
        <button type="button" id="tab-wardrobe">👕 Wardrobe</button>
        <button type="button" id="tab-inventory">🎒 Inventory</button>
      </div>
      <div id="catalog"></div>
      <div id="inventory"></div>
      <div id="furni-menu" hidden></div>
      <div id="hint">Click a chair to sit · click it again to stand · R turns the item you are
        holding · right-click furni to rotate or pick it up</div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" maxlength="200"
               placeholder="Enter to say · Shift+Enter to shout · /w name message to whisper" />
      </form>
    </div>
    <!-- The creator sits between the HUD it replaces and the login overlay, so DOM order alone
         decides the stack: login covers everything, the creator covers the room. -->
    <div id="creator"></div>
    <div id="login">
      <form id="login-form">
        <h1>The Grand</h1>
        <input id="username" name="username" placeholder="username (3-20: a-z 0-9 _ -)"
               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <input id="password" name="password" type="password" placeholder="password (8+ characters)"
               autocomplete="current-password" />
        <div class="row">
          <button type="submit">Log in</button>
          <button type="button" id="register">Register</button>
        </div>
        <div id="login-error"></div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
