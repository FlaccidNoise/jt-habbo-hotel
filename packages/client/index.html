<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Grand</title>
    <link rel="icon" href="data:," />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #11131a;
        color: #eef; font: 14px/1.4 system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; }
      #room-name { position: fixed; top: 10px; left: 12px; font-weight: 600;
        text-shadow: 0 1px 3px #000; pointer-events: none; }
      #stars { position: fixed; top: 32px; left: 12px; color: #ffd76a; font-weight: 600;
        text-shadow: 0 1px 3px #000; pointer-events: none; }
      #toasts { position: fixed; top: 10px; right: 12px; display: flex; flex-direction: column;
        gap: 6px; align-items: flex-end; pointer-events: none; }
      .toast { background: #7a1f1f; border: 1px solid #c25555; border-radius: 6px;
        padding: 6px 10px; max-width: 320px; box-shadow: 0 2px 8px #0008; }
      .toast.notice { background: #1f3a5f; border-color: #4a7ac2; }
      #login { position: fixed; inset: 0; display: grid; place-items: center;
        background: #11131aee; }
      #login form { display: grid; gap: 8px; width: 260px; background: #1c1f2b;
        border: 1px solid #333a4d; border-radius: 10px; padding: 18px; }
      #login h1 { margin: 0 0 4px; font-size: 18px; }
      #login input { padding: 7px 8px; border-radius: 6px; border: 1px solid #444c63;
        background: #10121a; color: #eef; }
      #login button { padding: 7px 8px; border-radius: 6px; border: 1px solid #444c63;
        background: #2c3346; color: #eef; cursor: pointer; }
      #login .row { display: flex; gap: 8px; }
      #login .row button { flex: 1; }
      #login-error { color: #ff9b9b; min-height: 18px; font-size: 13px; }
      #bubbles { position: fixed; inset: 0; pointer-events: none; }
      .bubble { position: absolute; transform: translate(-50%, -100%); max-width: 240px;
        background: #f4f4f8; color: #16181f; border-radius: 10px; padding: 4px 9px;
        box-shadow: 0 2px 6px #0006; opacity: 1; transition: opacity .8s linear;
        word-wrap: break-word; }
      .bubble.fading { opacity: 0; }
      .bubble.shout { font-weight: 700; }
      .bubble.whisper { font-style: italic; color: #6a1fb0; }
      .bubble.faded { color: #808895; font-style: italic; }
      #hud { position: fixed; left: 0; right: 0; bottom: 0; display: none;
        flex-direction: column; gap: 8px; padding: 10px 12px; }
      #chat-form { display: flex; }
      #chat-input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #444c63;
        background: #10121ae6; color: #eef; }
      #inventory { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #inventory button { padding: 5px 10px; border-radius: 8px; border: 1px solid #444c63;
        background: #1c1f2be6; color: #eef; cursor: pointer; }
      #inventory button.armed { border-color: #7fd98a; background: #24422a; }
      #inventory .empty { color: #7d8496; font-size: 13px; }
      #wardrobe { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #wardrobe .label { color: #9fd0ff; font-size: 13px; font-weight: 600; }
      #wardrobe button { padding: 5px 10px; border-radius: 8px; border: 1px solid #3c5670;
        background: #1b2836; color: #dbe6f2; cursor: pointer; font-size: 13px; }
      #wardrobe button.worn { border-color: #7fb2d9; background: #24405c; }
      #catalog { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #catalog .label { color: #ffd76a; font-size: 13px; font-weight: 600; }
      #catalog button { padding: 5px 10px; border-radius: 8px; border: 1px solid #6a5a2e;
        background: #2b2517e6; color: #eee0b0; cursor: pointer; }
      #catalog button:disabled { opacity: .45; cursor: default; }
      #furni-menu { display: flex; gap: 6px; align-items: center; }
      #furni-menu[hidden] { display: none; }
      #furni-menu .label { color: #9aa3b8; font-size: 13px; font-weight: 600; }
      #furni-menu button { padding: 5px 10px; border-radius: 8px; border: 1px solid #4b5f7d;
        background: #1b2433e6; color: #dbe7ff; cursor: pointer; }
      #hint { color: #7d8496; font-size: 12px; }
      #trade { position: fixed; top: 60px; right: 12px; width: 320px; background: #1c1f2bf2;
        border: 1px solid #333a4d; border-radius: 10px; padding: 14px; display: grid; gap: 8px; }
      #trade[hidden] { display: none; }
      #trade h2 { margin: 0; font-size: 15px; }
      #trade h3 { margin: 0 0 4px; font-size: 12px; color: #9aa3b8; font-weight: 600;
        text-transform: uppercase; letter-spacing: .04em; }
      #trade .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      #trade .items { display: flex; flex-direction: column; gap: 4px; min-height: 40px; }
      #trade .items button, #trade .items div { padding: 4px 8px; border-radius: 6px;
        border: 1px solid #444c63; background: #10121a; color: #eef; text-align: left; }
      #trade .items button { cursor: pointer; }
      #trade-warning { color: #ffb36a; font-size: 13px; min-height: 0; }
      #trade-warning:empty, #trade-status:empty { display: none; }
      #trade-status { color: #9fd9a6; font-size: 13px; }
      #trade .row { display: flex; gap: 8px; }
      #trade .row button { flex: 1; padding: 7px 8px; border-radius: 6px;
        border: 1px solid #444c63; background: #2c3346; color: #eef; cursor: pointer; }
      #trade .row button:disabled { opacity: .5; cursor: default; }
      #trade-accept:not(:disabled) { border-color: #7fd98a; background: #24422a; }
      #nav-open { position: fixed; top: 56px; left: 12px; padding: 5px 10px;
        border-radius: 8px; border: 1px solid #444c63; background: #1c1f2be6; color: #eef;
        cursor: pointer; display: none; }
      #suite-nav { position: fixed; top: 88px; left: 12px; padding: 5px 10px;
        border-radius: 8px; border: 1px solid #444c63; background: #1c1f2be6; color: #eef;
        cursor: pointer; display: none; }
      #arcade-open { position: fixed; top: 120px; left: 12px; padding: 5px 10px;
        border-radius: 8px; border: 1px solid #6a5a2e; background: #2b2517e6; color: #eee0b0;
        cursor: pointer; display: none; }
      #nav { position: fixed; top: 56px; left: 130px; width: 280px; background: #1c1f2bf2;
        border: 1px solid #333a4d; border-radius: 10px; padding: 14px; display: grid; gap: 8px; }
      #nav[hidden] { display: none; }
      #nav h2 { margin: 0; font-size: 15px; }
      #nav-list { display: grid; gap: 5px; max-height: 320px; overflow-y: auto; }
      #nav-list button { padding: 6px 9px; border-radius: 6px; border: 1px solid #444c63;
        background: #10121a; color: #eef; cursor: pointer; text-align: left; }
      #nav-list button:disabled { opacity: .5; cursor: default; }
      #nav-list .empty { color: #7d8496; font-size: 13px; }
      #nav-close { padding: 6px 9px; border-radius: 6px; border: 1px solid #444c63;
        background: #2c3346; color: #eef; cursor: pointer; }
      #arcade { position: fixed; top: 160px; left: 12px; width: 220px; background: #1c1f2bf2;
        border: 1px solid #333a4d; border-radius: 10px; padding: 14px; display: grid; gap: 8px;
        text-align: center; }
      #arcade[hidden] { display: none; }
      #arcade h2 { margin: 0; font-size: 15px; }
      #arcade-card { font-size: 40px; font-weight: 700; line-height: 1.1; }
      #arcade-score, #arcade-status { font-size: 13px; color: #9aa3b8; min-height: 18px; }
      #arcade .row { display: flex; gap: 6px; }
      #arcade .row button { flex: 1; padding: 7px 4px; border-radius: 6px;
        border: 1px solid #444c63; background: #2c3346; color: #eef; cursor: pointer; }
      #arcade .row button:disabled { opacity: .4; cursor: default; }
      #lever-open { position: fixed; top: 152px; left: 12px; padding: 5px 10px;
        border-radius: 8px; border: 1px solid #6a5a2e; background: #2b2517e6; color: #eee0b0;
        cursor: pointer; display: none; }
      #lever { position: fixed; top: 192px; left: 12px; width: 240px; background: #1c1f2bf2;
        border: 1px solid #333a4d; border-radius: 10px; padding: 14px; display: grid; gap: 8px;
        text-align: center; }
      #lever[hidden] { display: none; }
      #lever h2 { margin: 0; font-size: 15px; }
      #lever-result { font-size: 15px; font-weight: 600; min-height: 20px; }
      #lever-odds { font-size: 12px; color: #9aa3b8; display: grid; gap: 2px; text-align: left; }
      #lever-odds div { display: flex; justify-content: space-between; gap: 8px; }
      #lever .row { display: flex; gap: 6px; }
      #lever .row button { flex: 1; padding: 7px 4px; border-radius: 6px;
        border: 1px solid #444c63; background: #2c3346; color: #eef; cursor: pointer; }
      #lever .row button:disabled { opacity: .4; cursor: default; }
      #sets-open { position: fixed; top: 184px; left: 12px; padding: 5px 10px;
        border-radius: 8px; border: 1px solid #444c63; background: #1c1f2be6; color: #eef;
        cursor: pointer; display: none; }
      #sets { position: fixed; top: 224px; left: 12px; width: 260px; background: #1c1f2bf2;
        border: 1px solid #333a4d; border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
      #sets[hidden] { display: none; }
      #sets h2 { margin: 0; font-size: 15px; }
      #sets-list { display: grid; gap: 10px; max-height: 320px; overflow-y: auto; }
      #sets-list .set { display: grid; gap: 3px; }
      #sets-list .set b { font-size: 13px; }
      #sets-list .set .bar { font-size: 12px; color: #9aa3b8; }
      #sets-list .set.done .bar { color: #7fd48c; }
      #sets-list .set .need { font-size: 12px; color: #c9b27a; }
      #furni-menu .engraved { font-style: italic; color: #c9b27a; }
      /* #321: the strips covered the lower half of an oversized room. Collapsed behind tabs,
         one open at a time; chat, hint and the furni menu stay. */
      #hud-tabs { display: flex; gap: 6px; }
      #hud-tabs button { padding: 5px 10px; border-radius: 8px; border: 1px solid #444c63;
        background: #1c1f2be6; color: #eef; cursor: pointer; font-size: 13px; }
      #hud-tabs button.open { border-color: #7fb2d9; background: #24405c; }
      #catalog, #wardrobe, #inventory { display: none; }
      #catalog.open, #wardrobe.open, #inventory.open { display: flex; }
      #sets-close { padding: 6px 9px; border-radius: 6px; border: 1px solid #444c63;
        background: #2c3346; color: #eef; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="bubbles"></div>
    <div id="room-name"></div>
    <div id="stars"></div>
    <button type="button" id="nav-open">🧭 Rooms</button>
    <button type="button" id="suite-nav"></button>
    <button type="button" id="arcade-open">🎰 Hi-Lo</button>
    <button type="button" id="lever-open">🎟️ Luck Lever</button>
    <button type="button" id="sets-open">🏅 Collections</button>
    <div id="nav" hidden>
      <h2>Navigator</h2>
      <div id="nav-list"></div>
      <button type="button" id="nav-close">Close</button>
    </div>
    <div id="arcade" hidden>
      <h2>Hi-Lo</h2>
      <div id="arcade-card"></div>
      <div id="arcade-score"></div>
      <div class="row">
        <button type="button" id="arcade-higher">Higher</button>
        <button type="button" id="arcade-lower">Lower</button>
        <button type="button" id="arcade-stop">Stop</button>
      </div>
      <div id="arcade-status"></div>
      <div class="row">
        <button type="button" id="arcade-deal">Deal</button>
        <button type="button" id="arcade-close">Close</button>
      </div>
    </div>
    <div id="lever" hidden>
      <h2>Luck Lever</h2>
      <div id="lever-result"></div>
      <div class="row">
        <button type="button" id="lever-pull"></button>
        <button type="button" id="lever-close">Close</button>
      </div>
      <div id="lever-odds"></div>
    </div>
    <div id="sets" hidden>
      <h2>Collections</h2>
      <div id="sets-list"></div>
      <button type="button" id="sets-close">Close</button>
    </div>
    <div id="toasts"></div>
    <div id="trade" hidden>
      <h2 id="trade-title"></h2>
      <div class="cols">
        <div><h3>You give</h3><div id="trade-yours" class="items"></div></div>
        <div><h3>You get</h3><div id="trade-theirs" class="items"></div></div>
      </div>
      <div id="trade-warning"></div>
      <div id="trade-status"></div>
      <div class="row">
        <button type="button" id="trade-accept">Accept</button>
        <button type="button" id="trade-cancel">Cancel</button>
      </div>
    </div>
    <div id="hud">
      <div id="hud-tabs">
        <button type="button" id="tab-catalog">🛍️ Catalog</button>
        <button type="button" id="tab-wardrobe">👕 Wardrobe</button>
        <button type="button" id="tab-inventory">🎒 Inventory</button>
      </div>
      <div id="catalog"></div>
      <div id="wardrobe"></div>
      <div id="inventory"></div>
      <div id="furni-menu" hidden></div>
      <div id="hint">Click a chair to sit · click it again to stand · R turns the item you are
        holding · right-click furni to rotate or pick it up</div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" maxlength="200"
               placeholder="Enter to say · Shift+Enter to shout · /w name message to whisper" />
      </form>
    </div>
    <div id="login">
      <form id="login-form">
        <h1>The Grand</h1>
        <input id="username" name="username" placeholder="username (3-20: a-z 0-9 _ -)"
               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <input id="password" name="password" type="password" placeholder="password (8+ characters)"
               autocomplete="current-password" />
        <div class="row">
          <button type="submit">Log in</button>
          <button type="button" id="register">Register</button>
        </div>
        <div id="login-error"></div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
